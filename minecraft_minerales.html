// =====================================================================
// FPS CONTROLS
// =====================================================================
class FPSControls {
  constructor(camera, domElement) {
    this.camera = camera;
    this.domElement = domElement;
    this.isLocked = false;
    this._euler = new THREE.Euler(0, 0, 0, 'YXZ');
    this._PI_2 = Math.PI / 2;
    this._onMouseMove = this._onMouseMove.bind(this);
    this._onPointerlockChange = this._onPointerlockChange.bind(this);
    document.addEventListener('pointerlockchange',       this._onPointerlockChange);
    document.addEventListener('mozpointerlockchange',    this._onPointerlockChange);
    document.addEventListener('webkitpointerlockchange', this._onPointerlockChange);
    document.addEventListener('mousemove', this._onMouseMove);
    this._callbacks = { lock: [], unlock: [] };
  }
  addEventListener(event, cb) { if (this._callbacks[event]) this._callbacks[event].push(cb); }
  _emit(event) { (this._callbacks[event] || []).forEach(cb => cb()); }
  _onPointerlockChange() {
    const locked = document.pointerLockElement || document.mozPointerLockElement || document.webkitPointerLockElement;
    if (locked) { this.isLocked = true;  this._emit('lock');   }
    else         { this.isLocked = false; this._emit('unlock'); }
  }
  _onMouseMove(e) {
    if (!this.isLocked) return;
    this._euler.setFromQuaternion(this.camera.quaternion);
    this._euler.y -= (e.movementX || 0) * 0.002;
    this._euler.x -= (e.movementY || 0) * 0.002;
    this._euler.x = Math.max(-this._PI_2, Math.min(this._PI_2, this._euler.x));
    this.camera.quaternion.setFromEuler(this._euler);
  }
  lock() {
    document.body.requestPointerLock = document.body.requestPointerLock ||
      document.body.mozRequestPointerLock || document.body.webkitRequestPointerLock;
    document.body.requestPointerLock();
  }
  unlock() { document.exitPointerLock(); }
  moveForward(distance) {
    const dir = new THREE.Vector3();
    this.camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
    this.camera.position.addScaledVector(dir, distance);
  }
  moveRight(distance) {
    const dir = new THREE.Vector3();
    this.camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
    const right = new THREE.Vector3();
    right.crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
    this.camera.position.addScaledVector(right, distance);
  }
}

// La cuadrícula de crafteo: 9 slots
const craftGrid = Array.from({ length: 9 }, () => ({ type: null, count: 0 }));

function matchRecipe() {
  for (const recipe of RECIPES) {
    let match = true;
    for (let i = 0; i < 9; i++) {
      const expected = recipe.grid[i];
      const actual   = craftGrid[i].type;
      if (expected !== actual) { match = false; break; }
    }
    if (match) return recipe;
  }
  return null;
}

function consumeCraftIngredients() {
  for (let i = 0; i < 9; i++) {
    if (craftGrid[i].type) {
      craftGrid[i].count--;
      if (craftGrid[i].count <= 0) craftGrid[i] = { type: null, count: 0 };
    }
  }
}

// ── Generador de texturas procedurales ──────────────────────────────
function makeTexture(drawFn) {
  const S = 16;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  drawFn(ctx, S);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return tex;
}

// Ruido pixel a pixel estilo Minecraft
function noise(x, y, seed) {
  const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.3) * 43758.5453;
  return (n - Math.floor(n));
}

// Oscurece o aclara un color hex
function shadeHex(hex, amount) {
  const r = Math.min(255, Math.max(0, ((hex >> 16) & 0xff) + amount));
  const g = Math.min(255, Math.max(0, ((hex >>  8) & 0xff) + amount));
  const b = Math.min(255, Math.max(0, ((hex       ) & 0xff) + amount));
  return `rgb(${r},${g},${b})`;
}
function hexToRgb(hex) {
  return [(hex>>16)&0xff, (hex>>8)&0xff, hex&0xff];
}
function rgbStr(r,g,b) { return `rgb(${r|0},${g|0},${b|0})`; }

// Dibuja una cuadrícula pixelada con variación de ruido
function drawNoisy(ctx, S, baseHex, variance, seed) {
  const [br, bg, bb] = hexToRgb(baseHex);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const n = noise(x, y, seed);
      const v = (n - 0.5) * variance;
      ctx.fillStyle = rgbStr(br + v, bg + v, bb + v);
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

// Dibuja líneas de grilla (piedra, cobble, madera)
function drawGrid(ctx, S, lineColor, cols, rows) {
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1;
  for (let i = 1; i < cols; i++) {
    ctx.beginPath();
    ctx.moveTo((S / cols) * i, 0);
    ctx.lineTo((S / cols) * i, S);
    ctx.stroke();
  }
  for (let i = 1; i < rows; i++) {
    ctx.beginPath();
    ctx.moveTo(0, (S / rows) * i);
    ctx.lineTo(S, (S / rows) * i);
    ctx.stroke();
  }
}

// Para el césped necesitamos 6 caras distintas: top, bottom, sides
const blockMaterials = {};

function makeMat(tex, opts = {}) {
  const m = new THREE.MeshLambertMaterial({ map: tex, ...opts });
  return m;
}

// Grass: 6 materiales [right, left, top, bottom, front, back]
blockMaterials['grass'] = [
  makeMat(grassSideTex), makeMat(grassSideTex),
  makeMat(grassTopTex),  makeMat(dirtTex),
  makeMat(grassSideTex), makeMat(grassSideTex),
];

// Log: top/bottom distinto a los lados
blockMaterials['log'] = [
  makeMat(logSideTex), makeMat(logSideTex),
  makeMat(logTopTex),  makeMat(logTopTex),
  makeMat(logSideTex), makeMat(logSideTex),
];

// Bloques uniformes (misma textura en las 6 caras)

  bedrock: bedrockTex, stone: stoneTex,  cobble: cobbleTex,
  dirt:    dirtTex,    sand:  sandTex,   gravel: gravelTex,
  leaves:  leavesTex,  plank: plankTex,  glass:  glassTex,

  diamond_ore: diamondOreTex, emerald_ore: emeraldOreTex,
  lapis_ore: lapisOreTex, redstone_ore: redstoneOreTex,
};
for (const [type, tex] of Object.entries(uniformTextures)) {

  if (type === 'glass')  { opts.transparent = true; opts.opacity = 0.6; opts.depthWrite = false; }
  if (type === 'leaves') { opts.transparent = true; opts.opacity = 0.85; opts.alphaTest = 0.1; }
  blockMaterials[type] = makeMat(tex, opts);
}

// =====================================================================
// MAPA DE BLOQUES
// =====================================================================
// blockMap: key -> { type, mesh (Mesh individual solo para bloques modificados) }
// Para chunks normales usamos InstancedMesh por tipo
const blockMap = new Map();       // key -> { type, mesh? }
const chunkInstancedMeshes = new Map(); // chunkKey -> { type -> InstancedMesh }
const pendingChunkRebuild = new Set(); // chunks que necesitan reconstruirse

function blockKey(x, y, z) {
  return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
}

// Datos de bloques por chunk (antes de crear geometría)
const chunkBlockData = new Map(); // chunkKey -> Map(blockKey -> type)

function addBlock(x, y, z, type) {
  const key = blockKey(x, y, z);
  if (blockMap.has(key)) return;
  blockMap.set(key, { type });
}

function addBlockImmediate(x, y, z, type) {
  // Para bloques colocados por el jugador: Mesh individual
  const key = blockKey(x, y, z);
  if (blockMap.has(key)) return;
  const mesh = new THREE.Mesh(blockGeo, blockMaterials[type]);
  mesh.position.set(Math.round(x), Math.round(y), Math.round(z));
  mesh.userData.blockType = type;
  scene.add(mesh);
  blockMap.set(key, { type, mesh });
}

function removeBlock(x, y, z) {
  const key = blockKey(x, y, z);
  const entry = blockMap.get(key);
  if (!entry) return null;
  const type = entry.type;
  if (BLOCK_TYPES[type] && BLOCK_TYPES[type].unbreakable) return null;
  if (entry.mesh) {
    scene.remove(entry.mesh);
  }
  blockMap.delete(key);
  playerModified.add(key);
  // Marcar el chunk para reconstruir su InstancedMesh
  const [cx, cz] = worldToChunk(x, z);
  pendingChunkRebuild.add(chunkKey(cx, cz));
  return type;
}

function hasBlock(x, y, z) { return blockMap.has(blockKey(x, y, z)); }

function buildChunkMesh(cx, cz) {
  const ck = chunkKey(cx, cz);

  // Destruir InstancedMeshes anteriores del chunk
  if (chunkInstancedMeshes.has(ck)) {
    for (const im of Object.values(chunkInstancedMeshes.get(ck))) {
      scene.remove(im);
      im.dispose();
    }
    chunkInstancedMeshes.delete(ck);
  }

  // Recopilar bloques de este chunk
  const byType = {};
  const x0 = cx * CHUNK_SIZE, z0 = cz * CHUNK_SIZE;
  const dummy = new THREE.Object3D();

  for (let lx = 0; lx < CHUNK_SIZE; lx++) {
    for (let lz = 0; lz < CHUNK_SIZE; lz++) {
      const wx = x0 + lx, wz = z0 + lz;
      for (let y = -6; y <= 20; y++) {
        const k = blockKey(wx, y, wz);
        const entry = blockMap.get(k);
        if (!entry || entry.mesh) continue; // skip individual meshes
        const t = entry.type;
        if (!byType[t]) byType[t] = [];
        byType[t].push([wx, y, wz]);
      }
    }
  }

  const meshMap = {};
  for (const [type, positions] of Object.entries(byType)) {
    if (!blockMaterials[type]) continue;
    const im = new THREE.InstancedMesh(blockGeo, blockMaterials[type], positions.length);
    im.userData.isChunkMesh = true;
    im.userData.chunkKey = ck;
    positions.forEach(([px, py, pz], i) => {
      dummy.position.set(px, py, pz);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
      // Guardar posición para raycaster
      if (!im.userData.positions) im.userData.positions = [];
      im.userData.positions.push(blockKey(px, py, pz));
    });
    im.instanceMatrix.needsUpdate = true;
    scene.add(im);
    meshMap[type] = im;
  }
  chunkInstancedMeshes.set(ck, meshMap);
}

// =====================================================================
// MUNDO INFINITO POR CHUNKS
// =====================================================================
const CHUNK_SIZE  = 16;   // bloques por lado de chunk
const RENDER_DIST = 2;    // chunks visibles en cada dirección (reducido para FPS)
const UNLOAD_DIST = 4;    // chunks que se descargan al alejarse

const loadedChunks   = new Map();  // "cx,cz" -> Set de keys de bloques
const playerModified = new Set();  // keys que el jugador tocó (no se descargan)

// Ruido de altura usando senos (igual que el original, pero infinito)
function smoothNoise(x, z, seed) {
  // Interpola entre pseudoRand en enteros para ruido suave
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  // Suavizado cúbico
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);
  const a = pseudoRand(ix,   iz,   seed);
  const b = pseudoRand(ix+1, iz,   seed);
  const c = pseudoRand(ix,   iz+1, seed);
  const d = pseudoRand(ix+1, iz+1, seed);
  return a + (b-a)*ux + (c-a)*uz + (d-a)*ux*uz + (d-b-c+a)*ux*uz;
}

function getHeight(x, z) {
  // Octavas de ruido para terreno variado: colinas suaves + detalle fino + montañas ocasionales
  const base    = smoothNoise(x * 0.04,  z * 0.04,  1) * 18;  // colinas grandes
  const detail  = smoothNoise(x * 0.12,  z * 0.12,  2) * 5;   // detalle medio
  const micro   = smoothNoise(x * 0.35,  z * 0.35,  3) * 2;   // rugosidad fina
  const mountain= smoothNoise(x * 0.015, z * 0.015, 5);        // factor montaña
  const mBoost  = mountain > 0.65 ? (mountain - 0.65) * 40 : 0; // picos altos ocasionales
  return Math.floor(base + detail + micro + mBoost - 8);
}

// Pseudoaleatorio determinista por coordenada
function pseudoRand(x, z, seed) {
  const n = Math.sin(x * 127.1 + z * 311.7 + seed * 74.3) * 43758.5453;
  return n - Math.floor(n);
}

function chunkKey(cx, cz) { return `${cx},${cz}`; }

function worldToChunk(wx, wz) {
  return [Math.floor(wx / CHUNK_SIZE), Math.floor(wz / CHUNK_SIZE)];
}

function generateChunk(cx, cz) {
  const ck = chunkKey(cx, cz);
  if (loadedChunks.has(ck)) return;

  const blockKeys = new Set();
  const trees = [];

  for (let lx = 0; lx < CHUNK_SIZE; lx++) {
    for (let lz = 0; lz < CHUNK_SIZE; lz++) {
      const wx = cx * CHUNK_SIZE + lx;
      const wz = cz * CHUNK_SIZE + lz;
      const h  = getHeight(wx, wz);

      // Bedrock
      const bk = blockKey(wx, -6, wz);
      if (!playerModified.has(bk)) { addBlock(wx, -6, wz, 'bedrock'); blockKeys.add(bk); }

      for (let y = -5; y <= h; y++) {
        const k = blockKey(wx, y, wz);
        if (playerModified.has(k)) continue; // respeta modificaciones del jugador

        let type;
        if      (y === h)   type = 'grass';
        else if (y > h - 3) type = 'dirt';
        else {
          const r = pseudoRand(wx, wz * 100 + y, 1);
          const depth = h - y; // mayor = más profundo
          if      (r < 0.035 && depth >= 2)  type = 'coal';
          else if (r < 0.050 && depth >= 5)  type = 'iron_ore';
          else if (r < 0.060 && depth >= 8)  type = 'lapis_ore';
          else if (r < 0.068 && depth >= 10) type = 'gold_ore';
          else if (r < 0.073 && depth >= 12) type = 'redstone_ore';
          else if (r < 0.077 && depth >= 14) type = 'emerald_ore';
          else if (r < 0.080 && depth >= 16) type = 'diamond_ore';
          else                               type = 'stone';
        }

        addBlock(wx, y, wz, type);
        blockKeys.add(k);
      }

      // Arena en zonas bajas
      if (h < -1) {
        for (let y = h + 1; y <= -1; y++) {
          const k = blockKey(wx, y, wz);
          if (!playerModified.has(k)) { addBlock(wx, y, wz, 'sand'); blockKeys.add(k); }
        }
      }

      // Árboles
      if (h >= 0 && pseudoRand(wx, wz, 42) < 0.03) trees.push([wx, wz]);

      // Grava dispersa
      if (h >= 0 && pseudoRand(wx, wz, 99) < 0.015) {
        const gk = blockKey(wx, h, wz);
        if (!playerModified.has(gk) && blockMap.has(gk)) {
          scene.remove(blockMap.get(gk)); blockMap.delete(gk);
          addBlock(wx, h, wz, 'gravel'); blockKeys.add(gk);
        }
      }
    }
  }

  for (const [tx, tz] of trees) placeTree(tx, tz, blockKeys);

  loadedChunks.set(ck, blockKeys);
  buildChunkMesh(cx, cz);
}

function placeTree(x, z, blockKeys) {
  const h = getHeight(x, z) + 1;
  const trunkH = pseudoRand(x, z, 7) < 0.5 ? 4 : 5;
  for (let y = h; y < h + trunkH; y++) {
    const k = blockKey(x, y, z);
    if (!playerModified.has(k)) { addBlock(x, y, z, 'log'); if (blockKeys) blockKeys.add(k); }
  }
  const top = h + trunkH;
  for (let ly = top - 1; ly <= top + 1; ly++) {
    const r = ly === top + 1 ? 1 : 2;
    for (let lx = -r; lx <= r; lx++) {
      for (let lz = -r; lz <= r; lz++) {
        if (Math.abs(lx) === r && Math.abs(lz) === r) continue;
        const k = blockKey(x+lx, ly, z+lz);
        if (!hasBlock(x+lx, ly, z+lz) && !playerModified.has(k)) {
          addBlock(x+lx, ly, z+lz, 'leaves');
          if (blockKeys) blockKeys.add(k);
        }
      }
    }
  }
}

function unloadChunk(cx, cz) {
  const ck = chunkKey(cx, cz);
  const keys = loadedChunks.get(ck);
  if (!keys) return;
  // Eliminar InstancedMeshes del chunk
  if (chunkInstancedMeshes.has(ck)) {
    for (const im of Object.values(chunkInstancedMeshes.get(ck))) {
      scene.remove(im);
      im.dispose();
    }
    chunkInstancedMeshes.delete(ck);
  }
  for (const k of keys) {
    if (playerModified.has(k)) continue;
    const entry = blockMap.get(k);
    if (entry) {
      if (entry.mesh) scene.remove(entry.mesh);
      blockMap.delete(k);
    }
  }
  loadedChunks.delete(ck);
}

// Genera chunks alrededor del jugador; descarga los lejanos
// Se llama cada pocos frames para no bloquear
let chunkUpdateTimer = 0;
const CHUNK_UPDATE_INTERVAL = 0.25; // segundos

function updateChunks(delta) {
  chunkUpdateTimer += delta;
  if (chunkUpdateTimer < CHUNK_UPDATE_INTERVAL) return;
  chunkUpdateTimer = 0;

  const [pcx, pcz] = worldToChunk(camera.position.x, camera.position.z);

  // Cargar chunks cercanos
  for (let dx = -RENDER_DIST; dx <= RENDER_DIST; dx++) {
    for (let dz = -RENDER_DIST; dz <= RENDER_DIST; dz++) {
      if (!loadedChunks.has(chunkKey(pcx + dx, pcz + dz))) {
        generateChunk(pcx + dx, pcz + dz);
        return; // 1 chunk por tick para evitar freeze
      }
    }
  }

  // Descargar chunks lejanos
  for (const ck of loadedChunks.keys()) {
    const [cx, cz] = ck.split(',').map(Number);
    if (Math.abs(cx - pcx) > UNLOAD_DIST || Math.abs(cz - pcz) > UNLOAD_DIST) {
      unloadChunk(cx, cz);
      return;
    }
  }

  // Actualizar info en HUD
  document.getElementById('chunk-info').textContent =
    `Chunk: ${pcx}, ${pcz} | Bloques: ${blockMap.size}`;
}

// Genera los chunks iniciales de golpe (sin el timer) para que el mundo aparezca al inicio
function generateInitialChunks() {
  const [pcx, pcz] = worldToChunk(0, 0);
  for (let dx = -RENDER_DIST; dx <= RENDER_DIST; dx++) {
    for (let dz = -RENDER_DIST; dz <= RENDER_DIST; dz++) {
      generateChunk(pcx + dx, pcz + dz);
    }
  }
}

generateInitialChunks();

const highlightMesh = new THREE.Mesh(
  new THREE.BoxGeometry(1.01, 1.01, 1.01),
  new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.35, transparent: true, wireframe: true })
);
highlightMesh.visible = false;
scene.add(highlightMesh);

const ghostMat = new THREE.MeshLambertMaterial({ opacity: 0.4, transparent: true });
const ghostMesh = new THREE.Mesh(new THREE.BoxGeometry(1.02, 1.02, 1.02), ghostMat);
ghostMesh.visible = false;
scene.add(ghostMesh);

const raycaster = new THREE.Raycaster();
raycaster.far = 7;
const CENTER = new THREE.Vector2(0, 0);
let targetedBlock = null;

function updateRaycaster() {
  raycaster.setFromCamera(CENTER, camera);
  // Recopilar meshes cercanos: InstancedMeshes de chunks + meshes individuales del jugador
  const nearbyMeshes = [];
  // Meshes individuales (bloques colocados por jugador)
  const camX = Math.round(camera.position.x);
  const camY = Math.round(camera.position.y);
  const camZ = Math.round(camera.position.z);
  for (let dx = -8; dx <= 8; dx++) {
    for (let dy = -5; dy <= 5; dy++) {
      for (let dz = -8; dz <= 8; dz++) {
        const entry = blockMap.get(blockKey(camX+dx, camY+dy, camZ+dz));
        if (entry && entry.mesh) nearbyMeshes.push(entry.mesh);
      }
    }
  }
  // InstancedMeshes de los chunks cercanos
  const [pcx, pcz] = worldToChunk(camera.position.x, camera.position.z);
  for (let dx = -2; dx <= 2; dx++) {
    for (let dz = -2; dz <= 2; dz++) {
      const ck = chunkKey(pcx+dx, pcz+dz);
      const meshMap = chunkInstancedMeshes.get(ck);
      if (meshMap) {
        for (const im of Object.values(meshMap)) nearbyMeshes.push(im);
      }
    }
  }
  const hits = raycaster.intersectObjects(nearbyMeshes);
  if (hits.length > 0) {
    const hit = hits[0];
    // Resolver posición: Mesh normal vs InstancedMesh
    let hitPos;
    if (hit.object.isInstancedMesh) {
      const m = new THREE.Matrix4();
      hit.object.getMatrixAt(hit.instanceId, m);
      hitPos = new THREE.Vector3().setFromMatrixPosition(m);
    } else {
      hitPos = hit.object.position.clone();
    }
    highlightMesh.position.copy(hitPos);
    highlightMesh.visible = true;
    const normal = hit.face.normal.clone().round();
    const placePos = hitPos.clone().add(normal);
    const active = getActiveBlock();
    if (active) {
      ghostMat.color.set(BLOCK_TYPES[active].color);
      ghostMesh.position.copy(placePos);
      ghostMesh.visible = true;
    } else { ghostMesh.visible = false; }
    targetedBlock = { mesh: hit.object, position: hitPos, placePos };
  } else {
    highlightMesh.visible = false; ghostMesh.visible = false; targetedBlock = null;
  }
}

// INVENTARIO
// =====================================================================
const HOTBAR_SIZE = 9;
const INV_SIZE    = 27;
const hotbar  = Array.from({ length: HOTBAR_SIZE }, () => ({ type: null, count: 0 }));
const invGrid = Array.from({ length: INV_SIZE    }, () => ({ type: null, count: 0 }));
let activeHotbarSlot = 0;
let inventoryOpen    = false;
let heldItem         = null;

function getActiveBlock() { return hotbar[activeHotbarSlot].type; }

function giveItem(type, amount) {
  if (!BLOCK_TYPES[type]) return;
  let rem = amount;
  const all = [...hotbar, ...invGrid];
  for (const s of all) {
    if (s.type === type && s.count < 64) {
      const add = Math.min(64 - s.count, rem); s.count += add; rem -= add;
      if (rem <= 0) { renderHotbar(); return; }
    }
  }
  for (const s of all) {
    if (!s.type) {
      s.type = type; s.count = Math.min(rem, 64); rem -= s.count;
      if (rem <= 0) { renderHotbar(); return; }
    }
  }
  renderHotbar();
}

(function() {
  const items = ['grass','dirt','stone','cobble','sand','log','plank','glass','coal','gravel','leaves'];
  items.forEach((t, i) => {
    if (i < HOTBAR_SIZE) hotbar[i]                 = { type: t, count: 64 };
    else                  invGrid[i - HOTBAR_SIZE]  = { type: t, count: 64 };
  });
})();

// ── Vida del jugador ─────────────────────────────────────────────────

let lastFallY       = null;   // para detectar daño por caída
let invincibleTimer = 0;      // segundos de invencibilidad tras recibir daño

function damagePlayer(amount) {
  if (invincibleTimer > 0) return;
  playerHealth = Math.max(0, playerHealth - amount);
  invincibleTimer = 0.5;
  renderHealthBar();
  if (playerHealth <= 0) respawnPlayer();
}

function healPlayer(amount) {

  renderHealthBar();
}

function respawnPlayer() {

// ── Constantes de física ────────────────────────────────────────────
const RADIUS        = 0.30;   // radio del jugador
const PLAYER_HEIGHT = 1.62;   // altura ojos desde los pies
const GRAVITY       = 28.0;
const JUMP_SPEED    = 8.4;
const WALK_SPEED    = 4.8;
const MAX_FALL      = 22.0;
const STEP_HEIGHT   = 0.6;    // altura máxima de escalón automático

// solidAt: comprueba si hay bloque sólido en esa posición
function blockAt(x, y, z) {
  return hasBlock(Math.floor(x), Math.floor(y), Math.floor(z));
}
function solidAt(x, y, z) {
  return hasBlock(Math.floor(x), Math.floor(y), Math.floor(z));
}

// Las 4 esquinas horizontales del AABB (con margen pequeño)
function aabbCorners(px, pz) {
  const m = 0.02; // margen anti-tunneling
  return [
    [px - RADIUS + m, pz - RADIUS + m],
    [px + RADIUS - m, pz - RADIUS + m],
    [px - RADIUS + m, pz + RADIUS - m],
    [px + RADIUS - m, pz + RADIUS - m],
  ];
}

// Detecta si el AABB en (px,py,pz) solapa con bloques sólidos en el eje Y dado
// py = posición de los OJOS
function overlapY(px, py, pz) {
  const feet = py - PLAYER_HEIGHT;
  const head = py - 0.05;
  const corners = aabbCorners(px, pz);
  for (let scanY = Math.floor(feet); scanY <= Math.floor(head); scanY++) {
    for (const [cx2, cz2] of corners) {
      if (solidAt(cx2, scanY, cz2)) return true;
    }
  }
  return false;
}

// Colisión eje X con step-up
function resolveX(dx) {
  camera.position.x += dx;
  const x  = camera.position.x;
  const y0 = camera.position.y - PLAYER_HEIGHT + 0.01;
  const y1 = camera.position.y - 0.05;
  const zp = camera.position.z;
  const zOffsets = [-RADIUS + 0.03, 0, RADIUS - 0.03];

  let hit = false;
  if (dx > 0) {
    const rx = x + RADIUS;
    outer: for (let fy = y0; fy <= y1 + 0.01; fy += Math.max((y1-y0)/3, 0.01)) {
      for (const oz of zOffsets) {
        if (solidAt(rx, fy, zp + oz)) { hit = true; break outer; }
      }
    }
    if (hit) {
      // Intentar step-up
      const stepTop = Math.floor(camera.position.y - PLAYER_HEIGHT + STEP_HEIGHT) + 1;
      const feetAfterStep = stepTop;
      if (feetAfterStep - (camera.position.y - PLAYER_HEIGHT) <= STEP_HEIGHT && canJump) {
        let canStep = true;
        for (const oz of zOffsets) {
          if (solidAt(rx, feetAfterStep, zp + oz) || solidAt(rx, feetAfterStep + 1, zp + oz)) {
            canStep = false; break;
          }
        }
        if (canStep) { camera.position.y = feetAfterStep + PLAYER_HEIGHT; return; }
      }
      camera.position.x = Math.floor(rx) - RADIUS - 0.002;
    }
  } else if (dx < 0) {
    const lx = x - RADIUS;
    outer: for (let fy = y0; fy <= y1 + 0.01; fy += Math.max((y1-y0)/3, 0.01)) {
      for (const oz of zOffsets) {
        if (solidAt(lx, fy, zp + oz)) { hit = true; break outer; }
      }
    }
    if (hit) {
      const stepTop = Math.floor(camera.position.y - PLAYER_HEIGHT + STEP_HEIGHT) + 1;
      const feetAfterStep = stepTop;
      if (feetAfterStep - (camera.position.y - PLAYER_HEIGHT) <= STEP_HEIGHT && canJump) {
        let canStep = true;
        for (const oz of zOffsets) {
          if (solidAt(lx, feetAfterStep, zp + oz) || solidAt(lx, feetAfterStep + 1, zp + oz)) {
            canStep = false; break;
          }
        }
        if (canStep) { camera.position.y = feetAfterStep + PLAYER_HEIGHT; return; }
      }
      camera.position.x = Math.floor(lx) + 1 + RADIUS + 0.002;
    }
  }
}

// Colisión eje Z con step-up
function resolveZ(dz) {
  camera.position.z += dz;
  const z  = camera.position.z;
  const y0 = camera.position.y - PLAYER_HEIGHT + 0.01;
  const y1 = camera.position.y - 0.05;
  const xp = camera.position.x;
  const xOffsets = [-RADIUS + 0.03, 0, RADIUS - 0.03];

  let hit = false;
  if (dz > 0) {
    const fz = z + RADIUS;
    outer: for (let fy = y0; fy <= y1 + 0.01; fy += Math.max((y1-y0)/3, 0.01)) {
      for (const ox of xOffsets) {
        if (solidAt(xp + ox, fy, fz)) { hit = true; break outer; }
      }
    }
    if (hit) {
      const stepTop = Math.floor(camera.position.y - PLAYER_HEIGHT + STEP_HEIGHT) + 1;
      if (stepTop - (camera.position.y - PLAYER_HEIGHT) <= STEP_HEIGHT && canJump) {
        let canStep = true;
        for (const ox of xOffsets) {
          if (solidAt(xp + ox, stepTop, fz) || solidAt(xp + ox, stepTop + 1, fz)) { canStep = false; break; }
        }
        if (canStep) { camera.position.y = stepTop + PLAYER_HEIGHT; return; }
      }
      camera.position.z = Math.floor(fz) - RADIUS - 0.002;
    }
  } else if (dz < 0) {
    const bz = z - RADIUS;
    outer: for (let fy = y0; fy <= y1 + 0.01; fy += Math.max((y1-y0)/3, 0.01)) {
      for (const ox of xOffsets) {
        if (solidAt(xp + ox, fy, bz)) { hit = true; break outer; }
      }
    }
    if (hit) {
      const stepTop = Math.floor(camera.position.y - PLAYER_HEIGHT + STEP_HEIGHT) + 1;
      if (stepTop - (camera.position.y - PLAYER_HEIGHT) <= STEP_HEIGHT && canJump) {
        let canStep = true;
        for (const ox of xOffsets) {
          if (solidAt(xp + ox, stepTop, bz) || solidAt(xp + ox, stepTop + 1, bz)) { canStep = false; break; }
        }
        if (canStep) { camera.position.y = stepTop + PLAYER_HEIGHT; return; }
      }
      camera.position.z = Math.floor(bz) + 1 + RADIUS + 0.002;
    }
  }
}

// Colisión vertical mejorada
function resolveY(dy) {
  camera.position.y += dy;
  const cx = camera.position.x;
  const cz = camera.position.z;
  const corners = aabbCorners(cx, cz);

  if (dy <= 0) {
    // Cayendo/en suelo: barrido desde y actual hacia abajo
    const feetY = camera.position.y - PLAYER_HEIGHT;
    let groundTop = -Infinity;
    for (const [bx, bz2] of corners) {
      // Escanear hasta 3 bloques abajo
      for (let scan = 0; scan <= 2; scan++) {
        const by = Math.floor(feetY) - scan;
        if (solidAt(bx, by, bz2)) { groundTop = Math.max(groundTop, by + 1); break; }
      }
    }
    if (groundTop > -Infinity && feetY < groundTop + 0.02) {
      if (GAME_MODE === 'survival' && lastFallY !== null) {
        const fallDist = lastFallY - groundTop;
        if (fallDist > 3.5) damagePlayer(Math.floor(fallDist - 3));
      }
      camera.position.y = groundTop + PLAYER_HEIGHT;
      velocity.y = 0;
      canJump = true;
      lastFallY = null;
    }
  }
  if (dy > 0) {
    // Subiendo: comprobar techo
    const headY = camera.position.y - 0.01;
    for (const [bx, bz2] of corners) {
      if (solidAt(bx, headY, bz2)) {
        camera.position.y = Math.floor(headY) - 0.01;
        velocity.y = 0;
        break;
      }
    }
  }
}

function move(delta) {
  // ── MODO CREATIVO: vuelo libre ─────────────────────────────────────
  if (GAME_MODE === 'creative') {
    const spd = 14 * delta;
    const fwd  = new THREE.Vector3();
    const right = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    right.crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    if (keys['KeyW']) camera.position.addScaledVector(fwd,   spd);
    if (keys['KeyS']) camera.position.addScaledVector(fwd,  -spd);
    if (keys['KeyA']) camera.position.addScaledVector(right, -spd);
    if (keys['KeyD']) camera.position.addScaledVector(right,  spd);
    if (keys['Space'])    camera.position.y += spd;
    if (keys['ShiftLeft'] || keys['ShiftRight']) camera.position.y -= spd;
    return;
  }

  // ── MODO SUPERVIVENCIA ─────────────────────────────────────────────
  // Movimiento horizontal
  const fwd   = new THREE.Vector3();
  const right = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  right.crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();

  let moveX = 0, moveZ = 0;
  if (keys['KeyW']) { moveX += fwd.x;   moveZ += fwd.z; }
  if (keys['KeyS']) { moveX -= fwd.x;   moveZ -= fwd.z; }
  if (keys['KeyA']) { moveX -= right.x; moveZ -= right.z; }
  if (keys['KeyD']) { moveX += right.x; moveZ += right.z; }
  const hlen = Math.sqrt(moveX * moveX + moveZ * moveZ);
  if (hlen > 0) { moveX /= hlen; moveZ /= hlen; }

  // Gravedad — acumula ANTES de subdividir
  velocity.y -= GRAVITY * delta;
  velocity.y  = Math.max(velocity.y, -MAX_FALL);

  // Salto
  if (keys['Space'] && canJump) {
    velocity.y  = JUMP_SPEED;
    canJump     = false;
    lastFallY   = null;
  }

  // Registrar posición más alta para daño por caída
  if (velocity.y < -0.5 && lastFallY === null) lastFallY = camera.position.y - PLAYER_HEIGHT;
  if (canJump) lastFallY = null;

  if (invincibleTimer > 0) invincibleTimer -= delta;

  // Subdividir en pasos para evitar tunnel
  const SUBSTEPS = 4;
  const sd = delta / SUBSTEPS;
  const dx = moveX * WALK_SPEED * sd;
  const dz = moveZ * WALK_SPEED * sd;
  const dy = velocity.y * sd;

  for (let s = 0; s < SUBSTEPS; s++) {
    resolveX(dx);
    resolveZ(dz);
    resolveY(dy);
  }
}

  else if(type==='emerald'){
    rect(6,0,9,0,0x00FF55);rect(4,1,11,2,0x00C040);rect(3,3,12,6,0x00C040);
    rect(4,7,11,9,0x00FF55);rect(6,10,9,11,0x00FF55);
    ctx.fillStyle='rgba(180,255,180,0.8)';ctx.fillRect(16,6,8,8);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(18,8,4,4);
  }
  else if(type==='lapis'){
    rect(2,2,13,13,0x1A3E9A);rect(3,1,12,14,0x3A5FCC);rect(4,3,11,12,0x2A4EAA);
    ctx.fillStyle='rgba(100,150,255,0.5)';ctx.fillRect(10,6,8,8);
  }
  else if(type==='redstone'){
    for(let i=0;i<9;i++){const rx=pxn(i,0,91)*11+2|0,ry=pxn(0,i,91)*11+2|0;ctx.fillStyle='rgba(220,20,20,0.9)';ctx.fillRect(rx*2,ry*2,5,5);ctx.fillStyle='rgba(255,100,100,0.7)';ctx.fillRect(rx*2+1,ry*2+1,2,2);}
  }
  // bloques normales fallback
  else {
    const bc=BLOCK_TYPES[type]?BLOCK_TYPES[type].color:0x888888;
    noisy(0,0,16,16,bc,35,type.charCodeAt(0)||1);
    if(type==='grass'){noisy(0,0,16,4,0x3dbb3d,40,1);}
    if(type==='log'){ctx.strokeStyle='rgba(60,30,10,0.5)';ctx.lineWidth=1;for(let r=4;r<S/2;r+=4){ctx.beginPath();ctx.arc(S/2,S/2,r,0,Math.PI*2);ctx.stroke();}}
    if(type==='stone'||type==='cobble'){ctx.strokeStyle='rgba(50,50,50,0.3)';ctx.lineWidth=1;ctx.strokeRect(8,8,16,16);}
    if(type==='glass'){ctx.clearRect(0,0,S,S);ctx.fillStyle='rgba(176,216,240,0.5)';ctx.fillRect(0,0,S,S);ctx.strokeStyle='rgba(150,200,230,0.8)';ctx.lineWidth=1;ctx.strokeRect(2,2,S-4,S-4);ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(4,4,8,4);ctx.fillRect(4,4,4,8);}
  }
  const url=c.toDataURL();iconCache[type]=url;return url;
}
function applyIcon(el,type){
  if(!type){el.style.backgroundImage='none';el.style.backgroundColor='transparent';el.style.background='transparent';return;}
  el.style.backgroundImage=`url(${drawItemIcon(type)})`;
  el.style.backgroundSize='contain';
  el.style.backgroundRepeat='no-repeat';
  el.style.backgroundPosition='center';
  el.style.backgroundColor='transparent';
  el.style.imageRendering='pixelated';
}

function makeSlot(prefix, i, tooltip) {
  const slot = document.createElement('div');
  slot.id = `${prefix}-${i}`;
  slot.style.cssText = 'width:50px;height:50px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;box-sizing:border-box;';
  const icon = document.createElement('div');
  icon.id = `${prefix}-i-${i}`;
  icon.style.cssText = 'width:28px;height:28px;border-radius:3px;pointer-events:none;';
  const cnt = document.createElement('span');
  cnt.id = `${prefix}-c-${i}`;
  cnt.style.cssText = 'position:absolute;bottom:2px;right:4px;font-size:10px;color:white;text-shadow:1px 1px 2px #000;pointer-events:none;';
  slot.appendChild(icon); slot.appendChild(cnt);
  slot.addEventListener('mouseenter', e => {
    slot.style.borderColor = 'rgba(255,255,255,0.55)';
    const arr = prefix === 'ih' ? hotbar : invGrid;
    const s = arr[i];
    if (s.type) {
      tooltip.textContent = BLOCK_TYPES[s.type].name + ' x' + s.count;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top  = (e.clientY - 8) + 'px';
    }
  });
  slot.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top  = (e.clientY - 8) + 'px';
  });
  slot.addEventListener('mouseleave', () => { slot.style.borderColor = 'rgba(255,255,255,0.15)'; tooltip.style.display = 'none'; });
  slot.addEventListener('click', () => handleInvClick(prefix, i));
  return slot;
}

function renderInventoryUI() {
  for (let i = 0; i < INV_SIZE; i++) {
    const s = invGrid[i];
    const iconEl = document.getElementById(`ig-i-${i}`);
    const cntEl  = document.getElementById(`ig-c-${i}`);
    if (!iconEl) continue;
    applyIcon(iconEl, s.type);
    cntEl.textContent = (s.type && s.count > 1) ? s.count : '';
  }
  for (let i = 0; i < HOTBAR_SIZE; i++) {
    const s = hotbar[i];
    const iconEl = document.getElementById(`ih-i-${i}`);
    const cntEl  = document.getElementById(`ih-c-${i}`);
    const slotEl = document.getElementById(`ih-${i}`);
    if (!iconEl) continue;
    applyIcon(iconEl, s.type);
    cntEl.textContent = (s.type && s.count > 1) ? s.count : '';
    if (slotEl) slotEl.style.borderColor = i === activeHotbarSlot ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.15)';
  }
}

function handleInvClick(prefix, i) {
  const arr  = prefix === 'ih' ? hotbar : invGrid;
  const slot = arr[i];
  if (!heldItem) {
    if (slot.type) { heldItem = { type: slot.type, count: slot.count }; slot.type = null; slot.count = 0; }
  } else {
    if (!slot.type) { slot.type = heldItem.type; slot.count = heldItem.count; heldItem = null; }
    else if (slot.type === heldItem.type) {
      const total = slot.count + heldItem.count;
      slot.count  = Math.min(total, 64);
      const left  = total - slot.count;
      heldItem    = left > 0 ? { type: heldItem.type, count: left } : null;
    } else {
      const tmp = { type: slot.type, count: slot.count };
      slot.type = heldItem.type; slot.count = heldItem.count; heldItem = tmp;
    }
  }
  updateHeldCursor(); renderInventoryUI(); renderHotbar();
}

const heldCursor = document.createElement('div');
heldCursor.style.cssText = 'position:fixed;pointer-events:none;z-index:35;width:34px;height:34px;border-radius:4px;border:1px solid rgba(255,255,255,0.4);display:none;opacity:0.85;';
document.body.appendChild(heldCursor);
document.addEventListener('mousemove', e => {
  heldCursor.style.left = (e.clientX - 17) + 'px';
  heldCursor.style.top  = (e.clientY - 17) + 'px';
});
function updateHeldCursor() {
  if (heldItem) {
    heldCursor.style.display = 'block';
    applyIcon(heldCursor, heldItem.type);
  } else {
    heldCursor.style.display = 'none';
  }
}

// =====================================================================
// CRAFTEO — LÓGICA
// =====================================================================
function renderCraftGrid() {
  const recipe = matchRecipe();
  for (let i = 0; i < 9; i++) {
    const s = craftGrid[i];
    const iconEl = document.getElementById(`cg-i-${i}`);
    const cntEl  = document.getElementById(`cg-c-${i}`);
    const slotEl = document.getElementById(`cg-${i}`);
    if (!iconEl) continue;
    applyIcon(iconEl, s.type);
    cntEl.textContent = (s.type && s.count > 1) ? s.count : '';
  }
  // Actualizar resultado
  const resIcon = document.getElementById('craft-result-icon');
  const resCnt  = document.getElementById('craft-result-cnt');
  const resName = document.getElementById('craft-result-name');
  const resSlot = document.getElementById('craft-result');
  if (!resIcon) return;
  if (recipe) {
    applyIcon(resIcon, recipe.result);
    resCnt.textContent = recipe.count > 1 ? recipe.count : '';
    resName.textContent = recipe.name;
    resSlot.style.borderColor = 'rgba(100,255,100,0.5)';
  } else {
    applyIcon(resIcon, null);
    resCnt.textContent = '';
    resName.textContent = '';
    resSlot.style.borderColor = 'rgba(255,255,255,0.15)';
  }
}

function handleCraftGridClick(i) {
  const slot = craftGrid[i];
  if (!heldItem) {
    // Tomar lo que hay en la casilla
    if (slot.type) {
      heldItem = { type: slot.type, count: slot.count };
      craftGrid[i] = { type: null, count: 0 };
    }
  } else {
    // Colocar item en la casilla (solo bloques, no herramientas)
    if (BLOCK_TYPES[heldItem.type] && !BLOCK_TYPES[heldItem.type].isTool) {
      if (!slot.type) {
        craftGrid[i] = { type: heldItem.type, count: heldItem.count };
        heldItem = null;
      } else if (slot.type === heldItem.type) {
        const total = slot.count + heldItem.count;
        craftGrid[i].count = Math.min(total, 64);
        const left = total - craftGrid[i].count;
        heldItem = left > 0 ? { type: heldItem.type, count: left } : null;
      } else {
        // Intercambiar
        const tmp = { type: slot.type, count: slot.count };
        craftGrid[i] = { type: heldItem.type, count: heldItem.count };
        heldItem = tmp;
      }
    }
  }
  updateHeldCursor();
  renderCraftGrid();
  renderInventoryUI();
  renderHotbar();
}

function takeCraftResult() {
  const recipe = matchRecipe();
  if (!recipe) return;
  consumeCraftIngredients();
  giveItem(recipe.result, recipe.count);
  renderCraftGrid();
  renderInventoryUI();
  renderHotbar();
}

function clearCraftGrid() {
  for (let i = 0; i < 9; i++) {
    if (craftGrid[i].type) {
      giveItem(craftGrid[i].type, craftGrid[i].count);
      craftGrid[i] = { type: null, count: 0 };
    }
  }
  renderCraftGrid();
  renderInventoryUI();
  renderHotbar();
}

function openInventory() {
  inventoryOpen = true; controls.unlock();
  document.getElementById('inv-overlay').style.display = 'flex';
  document.getElementById('overlay').style.display = 'none';
  renderInventoryUI();
  renderCraftGrid();
}
function closeInventory() {
  inventoryOpen = false; heldItem = null;
  heldCursor.style.display = 'none';
  document.getElementById('inv-overlay').style.display = 'none';
  document.getElementById('inv-tooltip').style.display = 'none';
  controls.lock();
}

// =====================================================================
// INICIALIZAR UI
// =====================================================================
createHealthBarUI();
createHotbarUI();
createInventoryUI();
renderHotbar();
renderHealthBar();

// =====================================================================
// HUD
// =====================================================================
function updateHUD() {
  frameCount++;
  const now = performance.now();
  if (now - lastFPSTime >= 500) {
    document.getElementById('fps').textContent = 'FPS: ' + Math.round(frameCount / ((now - lastFPSTime) / 1000));
    frameCount = 0; lastFPSTime = now;
  }
  const p = camera.position;
  document.getElementById('pos').textContent = 'Pos: ' + p.x.toFixed(1) + ', ' + p.y.toFixed(1) + ', ' + p.z.toFixed(1);
}

// =====================================================================
// LOOP PRINCIPAL
// =====================================================================
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  if (controls.isLocked && !inventoryOpen) {
    move(delta);
    applyGravity(delta);
    applyHorizontalCollision();
    updateRaycaster();
    updateChunks(delta);
  }
  updateHUD();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
